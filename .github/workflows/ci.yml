name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Market rules tests
        run: npm run test:market

      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Build must not require real credentials; app falls back to demo mode.
          NEXT_TELEMETRY_DISABLED: 1

      - name: Browser tests (§54)
        run: npm run test:browser
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Migrations determinism — fresh DB boots from supabase/migrations/
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260908000001_market_core.sql
          test -f supabase/migrations/20260908000002_identity_quotes_observability.sql
          test -f supabase/migrations/20260909000001_analytics_events.sql
          test -f supabase/migrations/20260910000001_priced_profiles.sql
          test -f supabase/migrations/20260910000002_credit_ledger.sql
          test -f supabase/migrations/20260910000003_holder_analytics_rpc.sql
          test -f supabase/config.toml
          test -f supabase/migrations/README.md
          # Portable files must stay equivalent to the migration history.
          test -f db/schema.sql
          test -f db/schema-extended.sql
          grep -q "holder_analytics" db/schema-extended.sql
          grep -q "credit_ledger" db/schema-extended.sql
          echo "migrations structure checks passed"

      - name: Analytics + health smoke (no DB — verifies HTTP contract and taxonomy)
        run: |
          set -euo pipefail
          npx next start -p 3112 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3112/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3112/api/health | grep -q '"ok":true'
          curl -sf "http://127.0.0.1:3112/api/health?check=db" | grep -q '"ok"'
          # POST /api/analytics taxonomy + validation (demo mode: best-effort insert, never 500)
          curl -sf -X POST http://127.0.0.1:3112/api/analytics \
            -H 'content-type: application/json' \
            -d '{"event":"domain_opened","props":{"domain":"example.com"}}' | grep -q '"ok":true'
          # Unknown taxonomy must be rejected with 422.
          if curl -sf -X POST http://127.0.0.1:3112/api/analytics \
            -H 'content-type: application/json' \
            -d '{"event":"not_a_real_event"}' 2>/dev/null; then
            echo "expected 422 for unknown event"; exit 1;
          fi
          echo "analytics + health smoke passed"
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Concurrency race test over live HTTP (§74)
        run: |
          npx next start -p 3111 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3111/api/market/pulse > /dev/null; then break; fi
            sleep 1
          done
          node tests/load/race.mjs http://127.0.0.1:3111 12
          STATUS=$?
          kill $SERVER_PID
          exit $STATUS
        env:
          NEXT_TELEMETRY_DISABLED: 1
