name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Market rules tests
        run: npm run test:market

      - name: Concurrency tests
        run: npm run test:concurrency

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Build must not require real credentials; app falls back to demo mode.
          NEXT_TELEMETRY_DISABLED: 1

      - name: Browser tests (§54)
        run: npm run test:browser
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Concurrency race test over live HTTP (§74)
        run: |
          npx next start -p 3111 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3111/api/market/pulse > /dev/null; then break; fi
            sleep 1
          done
          node tests/load/race.mjs http://127.0.0.1:3111 12
          STATUS=$?
          kill $SERVER_PID
          exit $STATUS
        env:
          NEXT_TELEMETRY_DISABLED: 1
